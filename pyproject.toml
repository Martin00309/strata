[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "strata-db"
version = "0.1.0"
description = "An embedded, ordered, crash-safe key-value storage engine built on an LSM tree — pure Python, zero dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Martin Eduardo Muegues Baquero" }]
keywords = [
    "database",
    "key-value",
    "storage-engine",
    "lsm-tree",
    "embedded-database",
    "leveldb",
    "sstable",
    "bloom-filter",
    "mvcc",
    "developer-tools",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# Strata's engine is intentionally dependency-free: it runs on the Python
# standard library alone. Everything below is for development only.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[project.urls]
Homepage = "https://github.com/Martin00309/strata"
Repository = "https://github.com/Martin00309/strata"
Issues = "https://github.com/Martin00309/strata/issues"
Changelog = "https://github.com/Martin00309/strata/blob/main/CHANGELOG.md"

[project.scripts]
strata = "strata.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W", "C4", "UP"]
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
